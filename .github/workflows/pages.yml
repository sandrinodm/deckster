# Checks the site; it publishes nothing. The site is to be deployed by main's
# .github/workflows/deploy.yml, run by hand from the Actions tab: it checks
# out the tip of this branch, syncs the stills and decks from main (src/data
# is published as committed), builds the site and publishes it to GitHub
# Pages. A change here goes live on the next run of that workflow.
#
# NOT YET WORKING. This workflow and that deploy need three things deckster's
# main does not have yet: the docs scripts (scripts/docs-*.ts), the ?embed
# mode DeckEmbed loads, and the deploy.yml described above. All three exist
# only as uncommitted work in the product repository today. At main's current
# commit (4e0b186, "release v0.3.0") there are no docs scripts, so this
# workflow fails at its first sync; and main's deploy.yml publishes the deck
# gallery (`deck build --all`), never this site. Both start working once that
# work is committed on main; until then nothing deploys this branch.
#
# The site is built from generated inputs: src/data (committed), the slide
# stills in src/assets/shots and the built decks in public/decks (neither
# committed). `npm run sync` makes them from a checkout of deckster at
# DECKSTER_REF, which needs Node 26, pnpm and Chromium; the site itself is
# checked and built with Node 24.
#
# One source of truth: the committed src/data says which release the pages
# document (src/data/meta.json). CI regenerates it from DECKSTER_REF and fails
# when it differs, instead of quietly building reference tables for whatever
# main is today. When that check fails, sync the data against the ref and
# commit it with the pages it changes.
#
# The stills include the deck present windows (Electron, which needs a display:
# Xvfb here) and a deck export --verify picture (LibreOffice in Docker). The
# sync runs with DECKSTER_SHOTS_STRICT=1, so a shot skipped for a missing
# prerequisite fails it, and sync.mjs refuses UI shots that lack a name a page
# uses either way.
name: Docs site
on:
  push:
    branches: [docs-site]
  pull_request:
    branches: [docs-site]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold build of the LibreOffice image for the export-verify shot takes
    # several minutes.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Inside the workspace (actions/checkout requires it), and listed in
      # .gitignore and tsconfig.json's exclude so the site never reads it.
      DECKSTER_REPO: ${{ github.workspace }}/.deckster-main
      # The deckster ref the site is built from: a branch, tag or commit.
      # It stays main, not the v0.3.0 tag the pages document (4e0b186): the
      # docs scripts (scripts/docs-*.ts) and the ?embed mode DeckEmbed loads
      # are newer than the tag, and a checkout of v0.3.0 has neither. Today
      # main has neither too (its HEAD is 4e0b186; both are uncommitted work),
      # so this job fails until they are committed on main. The data
      # check below fails as soon as main's catalogs differ from the committed
      # src/data, so the reference can't drift past the release unnoticed.
      # Move this to a tag once a release carries the docs scripts and ?embed.
      DECKSTER_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # "Last updated" dates and the sitemap come from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out deckster
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sandrinodm/deckster
          ref: ${{ env.DECKSTER_REF }}
          path: .deckster-main
          persist-credentials: false

      # The site's dependencies, with the Node it builds with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # deckster's workspace: Node 26 and the pnpm version its package.json names.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: .deckster-main/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: .deckster-main/pnpm-lock.yaml
      - name: Install deckster
        working-directory: .deckster-main
        run: pnpm install --frozen-lockfile
      # deck shot and the UI shots drive Chromium.
      - name: Install the browser
        working-directory: .deckster-main
        run: pnpm exec playwright install chromium --with-deps
      # The present-audience and present-presenter shots run deckster's desktop
      # shell: Electron's binary (not part of pnpm install), the GTK, NSS, GBM
      # and audio libraries it links, and Xvfb, because Electron needs a display
      # even for hidden windows. Playwright starts it without the sandbox.
      - name: Install Electron and a virtual display
        working-directory: .deckster-main
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          pnpm --filter @deckster/shell exec install-electron
      # The export-verify shot runs deck export --verify, which renders the PPTX
      # with LibreOffice in Docker (the runner has Docker). Building the image
      # here keeps its time and errors out of the sync step.
      - name: Prepare export verification
        working-directory: .deckster-main
        run: pnpm --filter @deckster/export prepare:verify

      # Regenerates src/data and fails when it differs from the committed
      # files (meta.json's commit aside), so the reference tables never drift
      # from the release the pages describe.
      - name: Check src/data against deckster
        run: |
          npm run sync -- --data
          meta_changed=0
          diff <(git show HEAD:src/data/meta.json | jq 'del(.commit)') <(jq 'del(.commit)' src/data/meta.json) || meta_changed=1
          # --porcelain also lists a JSON file the generator newly writes.
          if [ "$meta_changed" = 1 ] || [ -n "$(git status --porcelain -- src/data ':(exclude)src/data/meta.json')" ]; then
            git status --short -- src/data
            echo "::error::src/data differs from deckster at $DECKSTER_REF. Run 'npm run sync -- --data' against that ref and commit src/data with the pages it changes, or pin DECKSTER_REF to the documented release."
            exit 1
          fi

      # Runs deckster's docs scripts with Node 26 into scratch folders, then
      # installs src/assets/shots and public/decks. Before the first check:
      # public/decks turns on link checking for /decks/ links. Under Xvfb, so
      # Electron can start; strict, so a skipped UI shot fails the step.
      - name: Generate stills and decks
        env:
          DECKSTER_SHOTS_STRICT: "1"
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run sync -- --shots --decks

      # Back to Node 24 for the site.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No page may carry its writing brief: /<page>/index.mdx would publish it.
      - name: Check for briefs
        run: npm run check:briefs
      # The MDX reader the coverage check, the sync and the Markdown twins share.
      - name: Check the MDX reader
        run: npm run check:mdx-source
      # Every layout, component, chart, diagram component and command in src/data
      # has a reference entry.
      - name: Check reference coverage
        run: npm run check:coverage
      - name: Check the site
        run: npx @cloudflare/nimbus-docs check
      - run: npm run build
      - name: Check links after the build
        run: npx @cloudflare/nimbus-docs check
