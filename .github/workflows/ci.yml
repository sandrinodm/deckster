name: CI

# Format, lint, types, unit and browser tests, a build of every deck and a lint of every deck, then
# a check that none of it left files behind; unit tests again on the oldest supported Node.
# Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and the tooling stylesheet
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare export verification images
        run: pnpm --filter @deckster/export prepare:verify

      # The deck CLI drives Playwright's Chromium; the browser suites drive the e2e package's.
      # Some unit tests render in Chromium too, so the browsers come before them.
      - name: Install browsers
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm --dir packages/engine exec e2e-web install chromium --with-deps

      # The export verification and chart equivalence tests need Docker for LibreOffice. They skip
      # themselves when Docker does not answer; the runner has it, so they run here.
      - name: Test
        run: pnpm test

      - name: Browser tests
        run: pnpm test:e2e

      - name: Build every deck
        run: pnpm build

      - name: Lint every deck
        run: |
          status=0
          for config in decks/*/deck.config.ts; do
            deck="$(basename "$(dirname "$config")")"
            echo "::group::deck lint $deck"
            pnpm deck lint "$deck" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # Every file a check, test or build writes belongs in .gitignore or is cleaned up afterwards.
      - name: Verify the checks leave the checkout clean
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            packages/*/.e2e
            .e2e
          if-no-files-found: ignore
          retention-days: 7

  # The oldest Node that package.json's `engines` accepts. The CLI and the root scripts run as
  # TypeScript through Node's type stripping, so a newer Node API would otherwise go unnoticed until
  # someone on 26.0 tried it. Unit tests and one deck build cover that; the browser suites stay on
  # the job above.
  node-floor:
    name: verify (Node 26.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.0.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare export verification images
        run: pnpm --filter @deckster/export prepare:verify

      - name: Test
        run: pnpm test

      - name: Build hello
        run: pnpm deck build hello
