name: CI

# Format, lint, types, unit and browser tests, a build of every deck and a lint of every deck, then
# a check that none of it left files behind; unit tests again on the oldest supported Node; and a
# smoke test of the packed CLI installed outside the repository.
# Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and the tooling stylesheet
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare export verification images
        run: pnpm --filter @deckster/export prepare:verify

      # The deck CLI drives Playwright's Chromium; the browser suites drive the e2e package's.
      # Some unit tests render in Chromium too, so the browsers come before them.
      - name: Install browsers
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm --dir packages/engine exec e2e-web install chromium --with-deps

      # The export verification and chart equivalence tests need Docker for LibreOffice. They skip
      # themselves when Docker does not answer; the runner has it, so they run here.
      - name: Test
        run: pnpm test

      - name: Browser tests
        run: pnpm test:e2e

      - name: Build every deck
        run: pnpm build

      - name: Lint every deck
        run: |
          status=0
          for config in decks/*/deck.config.ts; do
            deck="$(basename "$(dirname "$config")")"
            echo "::group::deckster lint $deck"
            pnpm deckster lint "$deck" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # Every file a check, test or build writes belongs in .gitignore or is cleaned up afterwards.
      - name: Verify the checks leave the checkout clean
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            packages/*/.e2e
            .e2e
          if-no-files-found: ignore
          retention-days: 7

  # The oldest Node that package.json's `engines` accepts. The CLI and the root scripts run as
  # TypeScript through Node's type stripping, so a newer Node API would otherwise go unnoticed until
  # someone on 26.0 tried it. Unit tests and one deck build cover that; the browser suites stay on
  # the job above.
  node-floor:
    name: verify (Node 26.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.0.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare export verification images
        run: pnpm --filter @deckster/export prepare:verify

      - name: Test
        run: pnpm test

      - name: Build hello
        run: pnpm deckster build hello

  # The CLI as users get it: packed, installed globally into an empty prefix and run in a folder
  # that is not a checkout. It catches a file missing from the tarball and a dependency the package
  # forgot to declare, which the repository's own run never notices.
  package-smoke:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack the CLI
        run: pnpm --filter @deckster/cli pack --out "$RUNNER_TEMP/deckster-cli.tgz"

      - name: Install the package globally
        working-directory: ${{ runner.temp }}
        run: npm install --global --no-audit --no-fund --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/deckster-cli.tgz"

      - name: Install the browser the installed package uses
        run: |
          "$RUNNER_TEMP/prefix/lib/node_modules/@deckster/cli/node_modules/.bin/playwright" install chromium --with-deps

      # The brand has a code layout and the deck a slide on it, so `layouts`, `new slide`, `lint`,
      # `build`, `shot` and `export` run its contract through the installed contract loader: the
      # only CI run of that loader outside the repository. `layouts eject` copies two kit layouts
      # (one with a shared helper) from the packed kit source, so the same commands also render the
      # ejected cover, and `layouts diff` must find the kit unchanged.
      - name: Create, check, build, shoot and export a deck
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          framework="$RUNNER_TEMP/prefix/lib/node_modules/@deckster/cli/dist/framework"
          mkdir workspace
          cd workspace
          deckster --help
          mkdir -p brands/smoke/layouts/kpi-wall
          cp -R "$framework/brands/default/logos" brands/smoke/logos
          sed "s/name: 'default'/name: 'smoke'/" "$framework/brands/default/brand.ts" > brands/smoke/brand.ts
          cat > brands/smoke/layouts/kpi-wall/contract.ts <<'EOF'
          import { defineLayoutContract } from '@deckster/engine/layout';
          import { Schema } from 'effect';

          export default defineLayoutContract({
            name: 'kpi-wall',
            description: 'Key figures as a wall of tiles.',
            schema: Schema.Struct({}),
            slots: { body: { description: 'The figures.', required: true, accepts: ['bullets'] } },
            budget: { body: { maxBullets: 2 } },
            example: { frontmatter: {}, body: '- 42% faster\n- 3 regions\n' },
          });
          EOF
          cat > brands/smoke/layouts/kpi-wall/layout.tsx <<'EOF'
          import { defineLayout, type LayoutProps } from '@deckster/engine';

          import type contract from './contract.ts';

          function KpiWall({ slots }: LayoutProps<typeof contract>) {
            return <div className="p-3xl type-body">{slots.body}</div>;
          }

          export default defineLayout<typeof contract>({ name: 'kpi-wall', component: KpiWall });
          EOF
          deckster brand check smoke
          deckster new smoke --brand smoke
          deckster new slide smoke wall --layout kpi-wall
          deckster layouts smoke --json > layouts.json
          node -e '
            const { layouts, warnings } = JSON.parse(require("node:fs").readFileSync("layouts.json", "utf8"));
            const wall = layouts.find((layout) => layout.name === "kpi-wall");
            if (warnings.length > 0 || wall?.source !== "brand-code:smoke") {
              console.error("The installed CLI did not load the brand code layout:", warnings, wall);
              process.exit(1);
            }
          '
          deckster layouts eject title quote --brand smoke
          deckster lint smoke
          deckster build smoke
          deckster layouts diff title --brand smoke --fail-on-change
          deckster shot smoke
          deckster export smoke --pdf
          deckster types
