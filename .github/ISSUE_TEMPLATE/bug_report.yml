name: Bug report
description: Report a bug or unexpected behavior in deckster
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below so we can reproduce it.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands run, minimal slide/deck config, or reproduction steps.
      placeholder: |
        1. Run `deck new demo`
        2. Run `deck lint demo`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any terminal output or `--json` output here.
      render: shell
  - type: input
    id: version
    attributes:
      label: deckster version
      description: Output of `deck --version` (or commit SHA if running from source).
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v` (deckster requires Node >= 26).
      placeholder: 'v26.0.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
