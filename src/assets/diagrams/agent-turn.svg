<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="An agent turn edits a working copy; only content files are copied into the deck">
  <title>An agent turn edits a working copy; only content files are copied into the deck</title>
  <style>
svg{--ink:#161514;--quiet:#6b6862;--edge:#c4c2bf;--grid:rgba(22,21,20,.12);--accent:#ff4f2b;--tint:rgba(22,21,20,.045);--paper:#ffffff}
text{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
</style>
  <defs>
    <marker id="agent-turn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">An agent turn edits a working copy; only content files are copied into the deck</text>
  <text class="note" x="24" y="54">One turn of deck dev --agent claude or codex, from the prompt to undo</text>
  <rect class="box violet" x="24" y="72" width="160" height="88" rx="8"/>
  <text class="name" x="36" y="96">Prompt</text>
  <text class="note" x="36" y="112">Sent from the panel over</text>
  <text class="note" x="36" y="128">/__deck/agent; queued,</text>
  <text class="note" x="36" y="144">one turn at a time</text>
  <rect class="box teal" x="208" y="72" width="160" height="88" rx="8"/>
  <text class="name" x="220" y="96">Turn guard</text>
  <text class="note" x="220" y="112">Records the deck&#x27;s other</text>
  <text class="note" x="220" y="128">files, holds its code,</text>
  <text class="note" x="220" y="144">makes a working copy</text>
  <rect class="box green" x="392" y="72" width="160" height="88" rx="8"/>
  <text class="name" x="404" y="96">Provider</text>
  <text class="note" x="404" y="112">Your claude or codex</text>
  <text class="note" x="404" y="128">edits the working copy,</text>
  <text class="note" x="404" y="144">calls the deck tools</text>
  <rect class="key" x="576" y="72" width="160" height="88" rx="8"/>
  <text class="name" x="588" y="96">Sync into the deck</text>
  <text class="small" x="588" y="114">Content files only, each</text>
  <text class="small" x="588" y="130">second, before a deck</text>
  <text class="small" x="588" y="146">tool, and at the end</text>
  <g class="line"><path d="M184 116H206" marker-end="url(#agent-turn-arrow)"/></g>
  <g class="line"><path d="M368 116H390" marker-end="url(#agent-turn-arrow)"/></g>
  <g class="line"><path d="M552 116H574" marker-end="url(#agent-turn-arrow)"/></g>
  <g class="line"><path d="M656 160V180H132V198" marker-end="url(#agent-turn-arrow)"/></g>
  <rect class="box teal" x="24" y="200" width="216" height="88" rx="8"/>
  <text class="name" x="36" y="224">Settle</text>
  <text class="note" x="36" y="240">Other files compared and any</text>
  <text class="note" x="36" y="256">change put back; the working</text>
  <text class="note" x="36" y="272">copy is retired</text>
  <rect class="box teal" x="272" y="200" width="216" height="88" rx="8"/>
  <text class="name" x="284" y="224">Journal</text>
  <text class="note" x="284" y="240">Records what the framework</text>
  <text class="note" x="284" y="256">changed in the deck; keeps</text>
  <text class="note" x="284" y="272">the last 50 turns</text>
  <rect class="box teal" x="520" y="200" width="216" height="88" rx="8"/>
  <text class="name" x="532" y="224">Lint</text>
  <text class="note" x="532" y="240">The deck is linted against</text>
  <text class="note" x="532" y="256">the findings from before</text>
  <text class="note" x="532" y="272">the turn</text>
  <g class="line"><path d="M240 244H270" marker-end="url(#agent-turn-arrow)"/></g>
  <g class="line"><path d="M488 244H518" marker-end="url(#agent-turn-arrow)"/></g>
  <g class="line"><path d="M380 288V326" marker-end="url(#agent-turn-arrow)"/></g>
  <text class="note" x="388" y="312">Undo in the panel</text>
  <g class="line"><path d="M628 288V326" marker-end="url(#agent-turn-arrow)"/></g>
  <text class="note" x="636" y="312">new errors</text>
  <rect class="box violet" x="272" y="328" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="352">Undo or redo</text>
  <text class="note" x="284" y="368">Restores the last turn&#x27;s files;</text>
  <text class="note" x="284" y="384">refuses one changed since</text>
  <rect class="box green" x="520" y="328" width="216" height="72" rx="8"/>
  <text class="name" x="532" y="352">One follow-up turn</text>
  <text class="note" x="532" y="368">Fixes the errors the turn</text>
  <text class="note" x="532" y="384">brought; never a second one</text>
  <rect class="callout" x="24" y="424" width="712" height="72" rx="8"/>
  <text class="name" x="40" y="446">What a turn may change</text>
  <text class="small" x="40" y="466">slides/*.mdx and *.tsx, and media and data in assets/ and public/. The slide list changes only</text>
  <text class="small" x="40" y="482">through the new_slide, reorder_slides and remove_slide tools. Anything else it writes is ignored.</text>
</svg>
