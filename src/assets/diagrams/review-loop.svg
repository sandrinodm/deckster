<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-label="Review runs from the terminal, and every comment points at the source line to fix">
  <title>Review runs from the terminal, and every comment points at the source line to fix</title>
  <style>
svg{--ink:#161514;--quiet:#6b6862;--edge:#c4c2bf;--grid:rgba(22,21,20,.12);--accent:#ff4f2b;--tint:rgba(22,21,20,.045);--paper:#ffffff}
text{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
</style>
  <defs>
    <marker id="review-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Review runs from the terminal, and every comment points at the source line to fix</text>
  <text class="note" x="24" y="54">One round of reviewing a deck with the deck CLI and comment mode in deck dev</text>
  <rect class="box teal" x="24" y="72" width="216" height="96" rx="8"/>
  <text class="name" x="36" y="96">Write</text>
  <text class="note code" x="36" y="114">deck dev</text>
  <text class="note" x="36" y="134">Edit the slide files; the</text>
  <text class="note" x="36" y="150">page reloads as you save</text>
  <rect class="box teal" x="272" y="72" width="216" height="96" rx="8"/>
  <text class="name" x="284" y="96">Lint</text>
  <text class="note code" x="284" y="114">deck lint</text>
  <text class="note" x="284" y="134">Schema, then every step</text>
  <text class="note" x="284" y="150">rendered; errors exit non-zero</text>
  <rect class="box teal" x="520" y="72" width="216" height="96" rx="8"/>
  <text class="name" x="532" y="96">Shot</text>
  <text class="note code" x="532" y="114">deck shot</text>
  <text class="note" x="532" y="134">1920x1080 PNGs in</text>
  <text class="note" x="532" y="150">.deck/shots/&lt;deck&gt;/</text>
  <rect class="box teal" x="520" y="264" width="216" height="96" rx="8"/>
  <text class="name" x="532" y="288">Diff</text>
  <text class="note code" x="532" y="306">deck diff</text>
  <text class="note" x="532" y="326">Pixel compare with HEAD;</text>
  <text class="note" x="532" y="342">report in .deck/diff/&lt;deck&gt;/</text>
  <rect class="box violet" x="24" y="264" width="216" height="96" rx="8"/>
  <text class="name" x="36" y="288">Fix</text>
  <text class="note code" x="36" y="306">deck comments --json</text>
  <text class="note" x="36" y="326">Read the location, edit it,</text>
  <text class="note" x="36" y="342">then deck comments resolve</text>
  <rect class="key" x="272" y="264" width="216" height="96" rx="8"/>
  <text class="name" x="284" y="288">Comment</text>
  <text class="small code" x="284" y="306">c in deck dev</text>
  <text class="small" x="284" y="326">Saved with file:line:column</text>
  <text class="small" x="284" y="342">in .feedback/&lt;slide&gt;.json</text>
  <g class="line"><path d="M240 120H270" marker-end="url(#review-loop-arrow)"/></g>
  <g class="line"><path d="M488 120H518" marker-end="url(#review-loop-arrow)"/></g>
  <g class="line"><path d="M628 168V262" marker-end="url(#review-loop-arrow)"/></g>
  <g class="line"><path d="M520 312H490" marker-end="url(#review-loop-arrow)"/></g>
  <g class="line"><path d="M272 312H242" marker-end="url(#review-loop-arrow)"/></g>
  <g class="line"><path d="M132 264V170" marker-end="url(#review-loop-arrow)"/></g>
  <text class="note mid" x="380" y="206">deck lint warns open-comments</text>
  <text class="note mid" x="380" y="222">while a slide has open comments</text>
</svg>
