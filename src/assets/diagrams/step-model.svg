<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-label="The hash counts deck steps: one per distinct &lt;Step at&gt; value, plus step 0">
  <title>The hash counts deck steps: one per distinct &lt;Step at&gt; value, plus step 0</title>
  <style>
svg{--ink:#161514;--quiet:#6b6862;--edge:#c4c2bf;--grid:rgba(22,21,20,.12);--accent:#ff4f2b;--tint:rgba(22,21,20,.045);--paper:#ffffff}
text{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
</style>
  <defs>
    <marker id="step-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">The hash counts deck steps: one per distinct &lt;Step at&gt; value, plus step 0</text>
  <text class="note" x="24" y="54">One slide, the second in its deck, with &lt;Step at={1}&gt; and &lt;Step at={3}&gt;, as the engine counts it</text>
  <rect class="box teal" x="24" y="72" width="344" height="88" rx="8"/>
  <text class="name" x="36" y="96">Slide source</text>
  <text class="small code" x="36" y="116">&lt;Step at={1}&gt;First point&lt;/Step&gt;</text>
  <text class="small code" x="36" y="134">&lt;Step at={3}&gt;Second point&lt;/Step&gt;</text>
  <text class="note" x="36" y="152">at is required; gaps between values are allowed</text>
  <rect class="box amber" x="392" y="72" width="344" height="88" rx="8"/>
  <text class="name" x="404" y="96">URL hash</text>
  <text class="small code" x="404" y="116">#/&lt;slide&gt;/&lt;step&gt;</text>
  <text class="note" x="404" y="134">Slide: 1-based number, or the slide id</text>
  <text class="note" x="404" y="150">Step: 0-based deck step; missing means 0</text>
  <g class="line"><path d="M196 160V198" marker-end="url(#step-model-arrow)"/></g>
  <text class="note" x="204" y="184">registers at = 1 and 3</text>
  <g class="line"><path d="M564 160V198" marker-end="url(#step-model-arrow)"/></g>
  <text class="note" x="572" y="184">names one deck step</text>
  <rect class="box zone violet" x="24" y="200" width="712" height="152" rx="8"/>
  <text class="name" x="40" y="224">Slide 2 has three deck steps; Space or the right arrow moves one</text>
  <rect class="box violet" x="40" y="240" width="200" height="96" rx="8"/>
  <text class="name" x="52" y="264">Deck step 0</text>
  <text class="small code" x="52" y="282">#/2/0</text>
  <text class="note" x="52" y="302">Nothing revealed yet</text>
  <text class="note" x="52" y="318">useStep() returns 0</text>
  <rect class="box violet" x="280" y="240" width="200" height="96" rx="8"/>
  <text class="name" x="292" y="264">Deck step 1</text>
  <text class="small code" x="292" y="282">#/2/1</text>
  <text class="note" x="292" y="302">at={1} revealed</text>
  <text class="note" x="292" y="318">useStep() returns 1</text>
  <rect class="key" x="520" y="240" width="200" height="96" rx="8"/>
  <text class="name" x="532" y="264">Deck step 2</text>
  <text class="small code" x="532" y="282">#/2/2</text>
  <text class="small" x="532" y="302">at={3} revealed as well</text>
  <text class="small" x="532" y="318">useStep() returns 3</text>
  <g class="line"><path d="M240 288H278" marker-end="url(#step-model-arrow)"/></g>
  <g class="line"><path d="M480 288H518" marker-end="url(#step-model-arrow)"/></g>
  <g class="line"><path d="M140 336V390" marker-end="url(#step-model-arrow)"/></g>
  <text class="note" x="148" y="370">back from step 0</text>
  <g class="line"><path d="M620 336V390" marker-end="url(#step-model-arrow)"/></g>
  <text class="note" x="628" y="370">on from step 2</text>
  <rect class="box teal" x="40" y="392" width="200" height="56" rx="8"/>
  <text class="name" x="52" y="416">Slide 1, its last step</text>
  <text class="note" x="52" y="432">Entered at its last step</text>
  <rect class="box teal" x="520" y="392" width="200" height="56" rx="8"/>
  <text class="name" x="532" y="416">Slide 3, step 0</text>
  <text class="note" x="532" y="432">Nothing revealed on arrival</text>
  <rect class="callout" x="24" y="472" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="494">The hash follows the deck</text>
  <text class="small" x="40" y="514">Every move rewrites it in place (Back leaves the deck); an edited hash moves the deck there.</text>
</svg>
