<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F5F2EB"/>
      <stop offset="1" stop-color="#E7E2D7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232220"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAF9F6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="14" dy="22" stdDeviation="20" flood-color="#4A4236" flood-opacity="0.26"/>
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#4A4236" flood-opacity="0.18"/>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/></g>
  <g clip-path="url(#body)">
    <rect x="226" y="270" width="440" height="308" rx="44" fill="url(#ink)" filter="url(#lift)"/>
    <rect x="358" y="402" width="440" height="308" rx="44" fill="url(#card)" filter="url(#lift)"/>
    <g fill="#161514">
      <rect x="402" y="468" width="88" height="66"/>
      <rect x="534" y="468" width="88" height="66"/>
      <rect x="402" y="578" width="88" height="66"/>
      <rect x="534" y="578" width="88" height="66"/>
      <rect x="666" y="578" width="88" height="66"/>
    </g>
    <rect x="666" y="468" width="88" height="66" fill="#FF4F2B"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="3"/>
</svg>
