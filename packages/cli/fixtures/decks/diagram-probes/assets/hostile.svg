<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600px" height="600" onload="document.title='pwned'">
  <script>window.__svgProbeRan = true;</script>
  <SCRIPT type="text/javascript">window.__svgProbeRan = true;</SCRIPT>
  <style>
    @import url(https://evil.example/theft.css);
    .zone { fill: #F4F5F8; stroke: rgb(154, 161, 174); }
    .hot { fill: tomato; }
  </style>
  <defs>
    <linearGradient id="sorter-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#e4572e" />
      <stop offset="1" style="stop-color: white" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="1560" height="560" rx="18" class="zone" stroke-width="3" />
  <g id="inbound">
    <rect x="60" y="60" width="420" height="480" rx="12" style="fill: #FFFFFF; stroke: rgb(154,161,174)" stroke-width="3" OnMouseOver='alert(1)' />
    <text x="270" y="300" text-anchor="middle" font-size="40" font-weight="600" fill="#161920">Inbound</text>
    <image x="200" y="380" width="140" height="80" href="https://evil.example/tracker.png" />
  </g>
  <g id="sorting">
    <rect x="560" y="60" width="480" height="480" rx="12" fill="url(#sorter-gradient)" stroke="#9aa1ae" stroke-width="3" />
    <circle cx="800" cy="300" r="80" class="hot" />
    <text x="800" y="120" text-anchor="middle" font-size="40" font-weight="600" fill="#161920">Sorter</text>
    <use href="https://evil.example/sprite.svg#arrow" x="760" y="440" />
  </g>
  <g id="outbound">
    <rect x="1120" y="60" width="420" height="480" rx="12" fill="white" stroke="#9AA1AE" stroke-width="3" />
    <a href="javascript:alert('outbound')">
      <text x="1330" y="300" text-anchor="middle" font-size="40" font-weight="600" fill="#161920">Outbound</text>
    </a>
    <foreignObject x="1160" y="380" width="340" height="100"><div xmlns="http://www.w3.org/1999/xhtml" onclick="alert(2)">HTML inside</div></foreignObject>
  </g>
</svg>
