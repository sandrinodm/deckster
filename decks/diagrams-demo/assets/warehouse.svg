<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" fill="none">
  <rect x="20" y="20" width="1560" height="560" rx="18" stroke="#9aa1ae" stroke-width="3" fill="#f4f5f8"/>
  <g id="inbound">
